name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle wrapper --gradle-version 8.9
      - name: Build APK with YouTube API key
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew assembleDebug -PYOUTUBE_API_KEY="$YOUTUBE_API_KEY"
      - uses: actions/upload-artifact@v4
        with: { name: int-view-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
