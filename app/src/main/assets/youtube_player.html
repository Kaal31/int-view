<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    html, body, #player { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    iframe { border: 0; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    // Curated public playlists: channel surfing rather than a browsable catalogue.
    const channels = [
      'PLx8zUw4PoWHgqy5bD0HcuuTgVqPOSNrHn',
      'PLLLojrb9yxrpsROvUuH4bs3FBYeC1Y7Zo',
      'PL1zuqabrVlPu09hsd9ANXCJCwIjone1mM',
      'PLd4hww6QWFS4uV1WLQnisBKnw2BzV8vax',
      'PLXKAG8g1Ls_Ax-SU7rCgyiGWjylB5NHL-',
      'PLYSmQ0A-61NNWwuLj_C3c7Lm-SkGXbVtz'
    ];

    let player;
    let channel = Math.floor(Math.random() * channels.length);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        width: '100%', height: '100%',
        playerVars: {
          autoplay: 1, controls: 0, disablekb: 1, fs: 0,
          iv_load_policy: 3, modestbranding: 1, rel: 0, playsinline: 1
        },
        events: {
          onReady: tune,
          onStateChange: event => {
            if (event.data === YT.PlayerState.ENDED) player.nextVideo();
          },
          onError: () => changeChannel(1)
        }
      });
    }

    function tune() {
      const firstVideo = Math.floor(Math.random() * 8);
      player.loadPlaylist({ listType: 'playlist', list: channels[channel], index: firstVideo });
      player.playVideo();
    }

    function changeChannel(delta) {
      channel = (channel + delta + channels.length) % channels.length;
      tune();
    }

    function togglePlayback() {
      if (!player) return;
      player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
    }
    function play() { if (player) player.playVideo(); }
    function pause() { if (player) player.pauseVideo(); }
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
